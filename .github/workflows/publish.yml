name: Update data and publish dashboard

on:
  push:
    branches: [main]
  schedule:
    # Daily 18:00 Hong Kong time. GitHub may start scheduled jobs later.
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: Fetch new source data before publishing
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: mortgage-publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Prepare Python libraries
        run: python -m pip install -r requirements.txt
      - name: Retrieve official source releases and update Excel
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: python -u update_mortgage_data.py
      - name: Generate dashboard from the saved workbook
        run: python update_mortgage_data.py --dashboard-only
      - name: Verify updater and publisher
        run: python -m unittest discover -s tests -v
      - name: Verify and prepare website
        run: python scripts/build_site.py
      - name: Save the refreshed workbook and source records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hk_mortgage_data.xlsx HK_Mortgage_Dashboard.html source_evidence.json discovered_reports.json T0307.xlsx dashboard_status.json update_status.txt
          if [ -f collection_report.json ]; then git add collection_report.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update workbook and dashboard snapshot"
            git push origin HEAD:main
          fi
      - name: Preserve update diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-diagnostics-${{ github.run_id }}
          path: |
            update_status.txt
            collection_report.json
            last_failure.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload verified website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
