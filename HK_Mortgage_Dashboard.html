<style>:root {
  color-scheme: light;
  font-family: Inter, "Helvetica Neue", Arial, sans-serif;
  --page: #f3f6f8;
  --surface: #fff;
  --ink: #142a3e;
  --muted: #526778;
  --line: #dce5ed;
  --nav: #102b43;
  --accent: #00796f;
  --accent-light: #e7f4f0;
  --mono: "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; color: var(--ink); background: var(--page); font-size: 14px; }
button, select { font: inherit; }
.wrap { max-width: 1440px; padding-inline: 38px; margin: 0 auto; }
.top { background: var(--nav); color: white; }
.top-inner { display: flex; align-items: center; justify-content: space-between; min-height: 64px; gap: 18px; }
.identity { display: flex; align-items: center; gap: 13px; font-weight: 660; letter-spacing: -.015em; font-size: 17px; }
.brand-mark { width: 20px; height: 18px; flex-shrink: 0; border-bottom: 2px solid #76d2bd; background: linear-gradient(to top,#76d2bd,#76d2bd) left bottom/4px 7px no-repeat,linear-gradient(to top,#76d2bd,#76d2bd) center bottom/4px 12px no-repeat,linear-gradient(to top,#76d2bd,#76d2bd) right bottom/4px 17px no-repeat; }
.sync { display: flex; align-items: center; gap: 8px; margin: 0; color: #e0edf5; font-size: 12px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #85e2c5; flex: 0 0 7px; }
.sync.stale .dot { background: #f1ba66; }
.tab-bar { background: #fff; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 32px; }
.tabs button { padding: 14px 2px 12px; border: 0; border-bottom: 3px solid transparent; color: var(--muted); background: transparent; font-weight: 620; cursor: pointer; }
.tabs button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); }
button:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
main { min-height: 68vh; padding-top: 29px; }
.section-head { display: flex; justify-content: space-between; align-items: end; gap: 14px; margin-bottom: 18px; }
h1 { font-size: clamp(24px, 3vw, 35px); line-height: 1.1; font-weight: 680; margin: 0 0 7px; letter-spacing: -.042em; }
h2 { margin: 0 0 5px; font-size: 17px; letter-spacing: -.02em; font-weight: 660; }
h3 { margin: 0; font-size: 14px; font-weight: 650; }
.sub, .chart-note { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 0; }
.control { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 12px; }
select { border: 1px solid #b8c9d7; background: white; color: var(--ink); border-radius: 6px; padding: 8px; }
.cards { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; margin-bottom: 19px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 16px 18px 15px; min-width: 0; }
.card.estimate { background: #eef8f4; border-color: #bfdcd2; }
.card-label { color: var(--muted); font-size: 12px; font-weight: 620; line-height: 1.4; }
.card-value { font-size: clamp(21px,3.2vw,31px); font-weight: 660; letter-spacing: -.036em; margin: 9px 0 5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.card-date { font-size: 12px; line-height: 1.35; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 17px; margin-bottom: 18px; }
.panel { padding: 17px 19px 15px; min-width: 0; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
.full { grid-column: 1 / -1; }
.chart-head { display: flex; justify-content: space-between; align-items: start; gap: 9px; margin-bottom: 10px; }
.canvas-box { position: relative; height: 245px; min-width: 0; overflow: hidden; }
.canvas-box canvas { display: block; max-width: 100%; }
.full .canvas-box { height: 270px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 9px; }
.chip { border: 1px solid var(--line); background: white; border-radius: 5px; padding: 5px 8px; cursor: pointer; color: var(--muted); font-size: 12px; }
.chip[aria-pressed="true"] { background: var(--accent-light); border-color: #a4c9bf; color: #045f56; font-weight: 640; }
.method { border-left: 3px solid var(--accent); background: var(--accent-light); padding: 10px 13px; margin: 0 0 16px; color: #224b4c; font-size: 12px; line-height: 1.55; }
.method strong { color: #163b3d; }
.estimate-caption { margin-top: 9px; }
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 12px; }
th, td { padding: 10px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); background: #f3f7fa; font-weight: 650; }
tbody tr:last-child td { border-bottom: 0; }
details summary { cursor: pointer; font-weight: 650; margin: 8px 0 10px; }
.footer { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin: 24px auto; font-size: 12px; color: var(--muted); }
.footer strong { font-weight: 600; color: var(--ink); }
.notice { padding: 12px 14px; border: 1px solid #dbc49d; background: #fff6e8; border-radius: 7px; margin-bottom: 16px; color: #6d4812; }
.empty { display: grid; height: 100%; place-items: center; color: var(--muted); font-size: 12px; }
@media (max-width: 940px) {
  .wrap { padding-inline: 23px; }
  .cards { grid-template-columns: repeat(2,minmax(0,1fr)); }
}
@media (max-width: 640px) {
  .wrap { padding-inline: 15px; }
  .top-inner { padding-block: 12px; gap: 7px; align-items: start; flex-direction: column; }
  .identity { font-size: 15px; gap: 9px; }
  .section-head { align-items: start; flex-direction: column; }
  .grid { grid-template-columns: minmax(0,1fr); }
  .card { padding: 12px; }
  .chart-head { flex-wrap: wrap; }
  .panel { padding-inline: 12px; }
  main { padding-top: 20px; }
}

<script id="dashboard-app">
"use strict";

const colors = ["#00796f", "#315f97", "#bd8037", "#82649f", "#52788a", "#a6525e"];
const state = {
  view: "overview",
  range: {overview: "36", mortgage: "24"},
  hiborDays: "90",
  tenors: new Set([0, 2, 3]),
  approvalsUnit: "count",
  registrationsGroup: "market",
  drawdownMeasure: "total",
  snapshot: null,
};
const tenorNames = ["Overnight", "1 week", "1 month", "3 months", "6 months", "12 months"];
const charts = new Map();
const dateMonth = new Intl.DateTimeFormat("en-HK", {month: "short", year: "numeric", timeZone: "UTC"});
const dateDay = new Intl.DateTimeFormat("en-HK", {day: "numeric", month: "short", year: "numeric", timeZone: "UTC"});
const savedAt = new Intl.DateTimeFormat("en-HK", {
  day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit",
  hourCycle: "h23", timeZone: "Asia/Hong_Kong",
});
const isNumber = value => typeof value === "number" && Number.isFinite(value);
const format = (value, decimals = 0) => isNumber(value)
  ? value.toLocaleString("en-HK", {minimumFractionDigits: decimals, maximumFractionDigits: decimals})
  : "—";
const last = (rows, col) => rows.findLast(row => isNumber(row[col]));
const monthLabel = key => key ? dateMonth.format(new Date(key.slice(0, 7) + "-01T00:00:00Z")) : "Unavailable";
const dayLabel = key => key ? dateDay.format(new Date(key + "T00:00:00Z")) : "Unavailable";
const monthNumber = key => Number(key.slice(0, 4)) * 12 + Number(key.slice(5, 7)) - 1;
const monthKey = number => Math.floor(number / 12) + "-" + String(number % 12 + 1).padStart(2, "0");
const latestTotal = rows => rows.findLast(row => isNumber(row[1]) && isNumber(row[2]));
const span = rows => rows.length ? monthLabel(rows[0][0]) + " – " + monthLabel(rows.at(-1)[0]) : "No saved observations";

function monthly(rows, range) {
  if (!rows.length) return [];
  const first = monthNumber(rows[0][0]);
  const end = monthNumber(rows.at(-1)[0]);
  const start = range === "all" ? first : Math.max(first, end - Number(range) + 1);
  const byMonth = new Map(rows.map(row => [row[0], row]));
  return Array.from({length: end - start + 1}, (_, i) => {
    const key = monthKey(start + i);
    return byMonth.get(key) || [key];
  });
}

function daily(rows, window) {
  if (!rows.length || window === "all") return rows;
  const cutoff = new Date(rows.at(-1)[0] + "T00:00:00Z");
  cutoff.setUTCDate(cutoff.getUTCDate() - Number(window) + 1);
  const start = cutoff.toISOString().slice(0, 10);
  return rows.filter(row => row[0] >= start);
}

function escapeText(text) {
  return String(text).replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[char]);
}

function card(label, value, date, css = "") {
  return '<article class="card ' + css + '"><div class="card-label">' + escapeText(label)
    + '</div><p class="card-value">' + escapeText(value) + '</p><div class="card-date">'
    + escapeText(date) + '</div></article>';
}

function select(label, id, options, value) {
  const choices = options.map(([key, title]) => '<option value="' + key + '"'
    + (key === value ? " selected" : "") + '>' + title + '</option>').join("");
  return '<label class="control" for="' + id + '">' + label + '<select id="' + id + '">' + choices + '</select></label>';
}

function panel(id, title, description, wide = false, control = "", inside = "", footer = "") {
  return '<article class="panel' + (wide ? ' full' : '') + '"><div class="chart-head"><div><h2>'
    + title + '</h2><p class="chart-note">' + escapeText(description)
    + '</p></div>' + control + '</div>' + inside
    + '<div class="canvas-box" id="' + id + '-box"><canvas id="' + id
    + '" role="img" aria-label="' + escapeText(title) + '"></canvas></div>' + footer + '</article>';
}

function viewHeader(title, view, description) {
  return '<div class="section-head"><div><h1>' + title + '</h1><p class="sub">' + description + '</p></div>'
    + select("Monthly history", view + "-range",
      [["12", "12 months"], ["24", "24 months"], ["36", "3 years"], ["60", "5 years"], ["all", "All history"]],
      state.range[view]) + '</div>';
}

function series(name, column, color, factor = 1, extras = {}) {
  return {name, color, value: row => isNumber(row[column]) ? row[column] * factor : null, ...extras};
}

function chart(id, rows, datasets, options = {}) {
  const canvas = document.getElementById(id);
  if (!rows.length || !datasets.some(dataset => rows.some(row => isNumber(dataset.value(row))))) {
    document.getElementById(id + "-box").innerHTML = '<div class="empty">No saved observations for this selection.</div>';
    return;
  }
  const type = options.type || "line";
  const config = {
    type,
    data: {
      labels: rows.map(row => options.daily ? dayLabel(row[0]) : monthLabel(row[0])),
      datasets: datasets.map(dataset => ({
        label: dataset.name,
        data: rows.map(dataset.value),
        borderColor: dataset.color,
        backgroundColor: dataset.signed
          ? context => context.raw < 0 ? "#ac5d61" : dataset.color
          : dataset.color,
        borderWidth: type === "bar" ? 0 : 2,
        borderRadius: type === "bar" ? 2 : 0,
        pointRadius: rows.length === 1 ? 3 : 0,
        pointHoverRadius: 4,
        tension: 0,
        spanGaps: false,
        stepped: dataset.stepped || false,
        maxBarThickness: 30,
      })),
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      interaction: {mode: "index", intersect: false},
      scales: {
        x: {
          stacked: options.stacked || false,
          grid: {display: false},
          ticks: {maxTicksLimit: 7, maxRotation: 0, autoSkip: true},
        },
        y: {
          stacked: options.stacked || false,
          beginAtZero: type === "bar" || options.zero === true,
          grid: {
            color: context => context.tick && context.tick.value === 0 ? "#b0bfcb" : "#e7eef3",
          },
          ticks: {
            maxTicksLimit: 6,
            callback: value => Number(value).toLocaleString("en-HK", {maximumFractionDigits: 2}) + (options.tickSuffix || ""),
          },
        },
      },
      plugins: {
        legend: {position: "bottom", display: datasets.length > 1, labels: {
          usePointStyle: true, boxWidth: 7, boxHeight: 7, padding: 13,
        }},
        tooltip: {
          padding: 11,
          callbacks: {
            label: item => item.dataset.label + ": " + format(item.raw, options.precision ?? 0) + (options.unit || ""),
            afterBody: options.lag ? items => {
              const key = rows[items[0].dataIndex][0];
              return "HKMA drawdown month: " + monthLabel(monthKey(monthNumber(key) - 1));
            } : undefined,
          },
        },
      },
    },
  };
  charts.set(id, new Chart(canvas, config));
}

function summaryTable(headers, rows) {
  const head = headers.map(label => '<th scope="col">' + escapeText(label) + '</th>').join("");
  const body = rows.map(row => '<tr>' + row.map(value => '<td>' + escapeText(value) + '</td>').join("") + '</tr>').join("");
  return '<div class="table-scroll"><table><thead><tr>' + head + '</tr></thead><tbody>'
    + body + '</tbody></table></div>';
}

function overview(data) {
  const latestM3 = last(data.m3, 1);
  const prime = last(data.prime, 1);
  const on = last(data.hibor, 1);
  const oneMonth = last(data.hibor, 3);
  const history = monthly(data.m3, state.range.overview);
  const recentDaily = daily(data.hibor, state.hiborDays);
  const primeHistory = data.prime.filter(row => isNumber(row[1]));
  const primeStart = history[0]?.[0] + "-01";
  const anchor = primeHistory.findLast(row => row[0] < primeStart);
  let effective = primeHistory.filter(row => row[0] >= primeStart);
  if (anchor) effective = [[primeStart, anchor[1]], ...effective];
  const primeEnd = data.hibor.at(-1)?.[0] || primeHistory.at(-1)?.[0];
  if (effective.length && primeEnd > effective.at(-1)[0]) {
    effective = [...effective, [primeEnd, effective.at(-1)[1]]];
  }
  const primeByDay = new Map(effective);
  const m3Months = history.map(row => row[0] + "-01");
  const effectiveDays = [...new Set([...m3Months, ...effective.map(row => row[0])])].sort();
  let currentPrime = null;
  const step = effectiveDays.map(key => {
    if (primeByDay.has(key)) currentPrime = primeByDay.get(key);
    return [key, currentPrime];
  });
  const chips = '<div class="chips" aria-label="HIBOR tenors">' + tenorNames.map((name, i) =>
    '<button type="button" class="chip" data-tenor="' + i + '" aria-pressed="'
    + state.tenors.has(i) + '">' + name + '</button>').join("") + '</div>';
  const hibs = select("Daily history", "hibor-days",
    [["30", "30 days"], ["90", "90 days"], ["180", "6 months"], ["365", "1 year"], ["all", "All history"]],
    state.hiborDays);
  document.getElementById("overview").innerHTML =
    viewHeader("Overview", "overview", "Money supply and interest rates")
    + '<div class="cards">'
    + card("HSBC prime rate", prime ? format(prime[1], 3) + "%" : "—", prime ? "Effective " + dayLabel(prime[0]) : "Unavailable")
    + card("Overnight HIBOR", on ? format(on[1], 5) + "%" : "—", on ? "Fixing " + dayLabel(on[0]) : "Unavailable")
    + card("1-month HIBOR", oneMonth ? format(oneMonth[3], 5) + "%" : "—", oneMonth ? "Fixing " + dayLabel(oneMonth[0]) : "Unavailable")
    + card("Hong Kong dollar M3", latestM3 ? "HK$" + format(latestM3[1] / 1e6, 2) + "tn" : "—", latestM3 ? monthLabel(latestM3[0]) : "Unavailable")
    + '</div><div class="grid">'
    + panel("hibor", "Daily HIBOR fixings", "Percent per year · " + (recentDaily.length ? dayLabel(recentDaily[0][0]) + " – " + dayLabel(recentDaily.at(-1)[0]) : "Unavailable"), true, hibs, chips)
    + panel("m3", "Money supply M3", "HK$ trillion · " + span(history))
    + panel("prime", "HSBC prime rate", "Percent per year · effective rates")
    + '</div>';
  chart("hibor", recentDaily, tenorNames.flatMap((name, i) => state.tenors.has(i) ? [series(name, i + 1, colors[i])] : []),
    {daily: true, tickSuffix: "%", unit: "%", precision: 5});
  chart("m3", history, [series("All currencies", 2, colors[1], 1e-6), series("Hong Kong dollar", 1, colors[0], 1e-6)],
    {unit: " HK$tn", precision: 3});
  chart("prime", step, [series("HSBC prime", 1, colors[1], 1, {stepped: "before"})],
    {daily: true, tickSuffix: "%", unit: "%", precision: 3});
}

function mortgage(data) {
  const range = state.range.mortgage;
  const registered = latestTotal(data.registrations);
  const drawn = last(data.bank, 10);
  const residual = last(data.nonbank, 1);
  const bankMonth = residual ? monthKey(monthNumber(residual[0]) - 1) : null;
  const purchase = bankMonth && data.nonbank.find(row => row[0] === bankMonth);
  const regs = monthly(data.registrations, range);
  const bank = monthly(data.bank, range);
  const estimated = monthly(data.nonbank.filter(row => row[0] >= data.nonbank.find(row => isNumber(row[1]))?.[0]), range);
  const registry = monthly(data.registry, range);
  const amount = state.approvalsUnit === "amount";
  const housing = state.registrationsGroup === "housing";
  const average = state.drawdownMeasure === "average";
  const columns = amount ? [7, 8, 9] : [4, 5, 6];
  const metricSelect = select("Measure", "approvals-unit", [["count", "Loans"], ["amount", "HK$ billion"]], state.approvalsUnit);
  const registrationSelect = select("Breakdown", "registrations-group",
    [["market", "Completed and off-plan"], ["housing", "Completed by housing type"]], state.registrationsGroup);
  const valueSelect = select("Measure", "drawdown-measure",
    [["total", "Total drawn down"], ["average", "Average approved loan"]], state.drawdownMeasure);
  const registrationMap = new Map(data.registrations.map(row => [row[0], row]));
  const estimateMap = new Map(data.nonbank.map(row => [row[0], row]));
  const detail = estimated.filter(row => isNumber(row[1])).slice(-12).reverse().map(row => {
    const r = registrationMap.get(row[0]);
    const lag = monthKey(monthNumber(row[0]) - 1);
    const d = estimateMap.get(lag);
    return [monthLabel(row[0]), r && isNumber(r[1]) && isNumber(r[2]) ? format(r[1] + r[2]) : "—",
      monthLabel(lag), format(d?.[2], 2), format(row[1], 2)];
  });
  document.getElementById("mortgage").innerHTML =
    viewHeader("Mortgage", "mortgage", "Mortgage registrations, bank activity and the workbook estimate")
    + '<div class="cards">'
    + card("Completed and off-plan registrations", registered ? format(registered[1] + registered[2]) : "—", registered ? monthLabel(registered[0]) + " · Centaline" : "Unavailable")
    + card("Bank drawdowns", drawn ? format(drawn[10]) : "—", drawn ? monthLabel(drawn[0]) + " · HKMA" : "Unavailable")
    + card("Estimated bank purchase drawdowns", format(purchase?.[2], 2), bankMonth ? monthLabel(bankMonth) + " · matched to estimate" : "Unavailable")
    + card("Non-bank residual estimate", format(residual?.[1], 2), residual ? monthLabel(residual[0]) + " · registration month" : "Unavailable", "estimate")
    + '</div><div class="grid">'
    + panel("residual", "Non-bank residual estimate", "Loans · " + span(estimated), true, "", "",
      '<p class="chart-note estimate-caption">Model estimate from Centaline registrations and prior-month HKMA drawdowns. The sources cover different lenders and loan events.</p>')
    + panel("registrations", "Centaline mortgage registrations", "Registrations · " + span(regs), false, registrationSelect)
    + panel("approvals", "Bank approvals by purpose", (amount ? "HK$ billion" : "Loans") + " · " + span(bank), false, metricSelect)
    + panel("drawdowns", "Bank applications and drawdowns", "Loans · " + span(bank))
    + panel("registry", "Land Registry mortgage documents", "Documents · " + span(registry))
    + panel("balances", "Outstanding bank mortgages", "HK$ billion · " + span(bank))
    + panel("drawn-value", average ? "Average approved bank loan" : "New bank drawdown value",
      (average ? "HK$ million" : "HK$ billion") + " · " + span(bank), false, valueSelect)
    + '</div><article class="panel"><details><summary>Estimate detail and calculation</summary>'
    + '<p class="method">The workbook subtracts the preceding month’s estimated bank purchase drawdowns from current-month completed and off-plan registrations. The bank estimate uses the purchase share of approvals multiplied by actual drawdowns. Lender coverage differs between sources.</p>'
    + summaryTable(["Registration month", "Centaline registrations", "HKMA month", "Est. bank purchase drawdowns", "Residual estimate"], detail)
    + '</details></article>';
  chart("residual", estimated, [series("Non-bank residual estimate", 1, colors[0], 1, {signed: true})],
    {type: "bar", lag: true, precision: 2});
  chart("registrations", regs, housing
    ? [series("Private residential", 3, colors[1]), series("Subsidised housing", 4, colors[0])]
    : [series("Completed", 1, colors[1]), series("Off-plan", 2, colors[0])],
    {type: "bar", stacked: !housing});
  chart("approvals", bank, ["Primary market", "Secondary market", "Refinancing"].map((name, i) =>
    series(name, columns[i], colors[i], amount ? 0.001 : 1)),
    {type: "bar", stacked: true, unit: amount ? " HK$bn" : "", precision: amount ? 2 : 0});
  chart("drawdowns", bank, [series("Applications", 1, colors[1]), series("Drawdowns", 10, colors[0])], {zero: true});
  chart("registry", registry, [series("Other mortgages and charges", 2, colors[1]), series("Releases", 3, colors[0])], {zero: true});
  chart("balances", bank, [series("Outstanding mortgages", 13, colors[1], 0.001)], {unit: " HK$bn", precision: 2});
  chart("drawn-value", bank, [average
    ? series("Average approved loan", 12, colors[0])
    : series("Drawdown value", 11, colors[0], 0.001)],
    {type: average ? "line" : "bar", unit: average ? " HK$mn" : " HK$bn", precision: 2});
}

function render() {
  if (!state.snapshot) return;
  const open = document.querySelector("#mortgage details")?.open;
  charts.forEach(instance => instance.destroy());
  charts.clear();
  const view = state.view;
  const inactive = view === "overview" ? "mortgage" : "overview";
  document.getElementById(inactive).hidden = true;
  document.getElementById(view).hidden = false;
  (view === "overview" ? overview : mortgage)(state.snapshot.series);
  if (open && view === "mortgage") document.querySelector("#mortgage details").open = true;
}

function activate(view, focus = false) {
  state.view = view;
  document.querySelectorAll("[data-tab]").forEach(button => {
    const selected = button.dataset.tab === view;
    button.setAttribute("aria-selected", selected);
    button.tabIndex = selected ? 0 : -1;
    if (selected && focus) button.focus();
  });
  render();
}

document.querySelector(".tabs").addEventListener("click", event => {
  const button = event.target.closest("[data-tab]");
  if (button) activate(button.dataset.tab);
});
document.querySelector(".tabs").addEventListener("keydown", event => {
  if (["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) {
    event.preventDefault();
    const next = event.key === "Home" ? "overview" : event.key === "End" ? "mortgage"
      : state.view === "overview" ? "mortgage" : "overview";
    activate(next, true);
  }
});
document.querySelector("main").addEventListener("change", event => {
  const {id, value} = event.target;
  if (id === "overview-range") state.range.overview = value;
  else if (id === "mortgage-range") state.range.mortgage = value;
  else if (id === "hibor-days") state.hiborDays = value;
  else if (id === "approvals-unit") state.approvalsUnit = value;
  else if (id === "registrations-group") state.registrationsGroup = value;
  else if (id === "drawdown-measure") state.drawdownMeasure = value;
  else return;
  render();
  document.getElementById(id)?.focus({preventScroll: true});
});
document.querySelector("main").addEventListener("click", event => {
  const chip = event.target.closest("[data-tenor]");
  if (!chip) return;
  const index = Number(chip.dataset.tenor);
  if (state.tenors.has(index)) {
    if (state.tenors.size === 1) return;
    state.tenors.delete(index);
  } else {
    state.tenors.add(index);
  }
  render();
  document.querySelector('[data-tenor="' + index + '"]')?.focus({preventScroll: true});
});

function connection(saved, message = "") {
  const status = document.getElementById("status");
  status.hidden = !message;
  status.textContent = message;
  const sync = document.getElementById("sync");
  sync.classList.toggle("stale", !!message);
  sync.replaceChildren(Object.assign(document.createElement("span"), {className: "dot"}),
    saved ? "Snapshot prepared " + savedAt.format(new Date(saved)) + " HKT" : "Waiting for workbook");
}

const viewKey = 'hk-mortgage-monitor-view-v1';
let lastInteraction = Date.now();

function saveView() {
  const saved = {
    view: state.view, range: state.range, hiborDays: state.hiborDays,
    tenors: Array.from(state.tenors), approvalsUnit: state.approvalsUnit,
    registrationsGroup: state.registrationsGroup, drawdownMeasure: state.drawdownMeasure,
    detailOpen: !!document.querySelector('#mortgage details')?.open,
    scroll: window.scrollY,
  };
  try {
    sessionStorage.setItem(viewKey, JSON.stringify(saved));
    return true;
  } catch { return false; }
}

function restoreView() {
  try {
    const saved = JSON.parse(sessionStorage.getItem(viewKey) || '{}');
    if (['overview', 'mortgage'].includes(saved.view)) state.view = saved.view;
    for (const view of ['overview', 'mortgage']) {
      if (['12', '24', '36', '60', 'all'].includes(saved.range?.[view])) state.range[view] = saved.range[view];
    }
    if (['30', '90', '180', '365', 'all'].includes(saved.hiborDays)) state.hiborDays = saved.hiborDays;
    if (Array.isArray(saved.tenors)) {
      const tenors = saved.tenors.filter(value => Number.isInteger(value) && value >= 0 && value < 6);
      if (tenors.length) state.tenors = new Set(tenors);
    }
    if (['count', 'amount'].includes(saved.approvalsUnit)) state.approvalsUnit = saved.approvalsUnit;
    if (['market', 'housing'].includes(saved.registrationsGroup)) state.registrationsGroup = saved.registrationsGroup;
    if (['total', 'average'].includes(saved.drawdownMeasure)) state.drawdownMeasure = saved.drawdownMeasure;
    return saved;
  } catch { return {}; }
}

function reloadDashboard() {
  saveView();
  window.location.reload();
}

Chart.defaults.font.family = 'Inter, "Helvetica Neue", Arial, sans-serif';
Chart.defaults.font.size = 11;
Chart.defaults.color = '#526778';

try {
  const saved = restoreView();
  const data = JSON.parse(document.getElementById('workbook-data').textContent);
  if (data.schemaVersion !== 1 || !data.series || !data.savedAt) throw new Error('The saved workbook snapshot is invalid.');
  state.snapshot = data;
  document.getElementById('workbook').textContent = data.workbook;
  document.getElementById('generated').textContent = 'Dashboard updated ' + savedAt.format(new Date(data.generatedAt || data.savedAt)) + ' HKT';
  activate(state.view);
  if (saved.detailOpen && state.view === 'mortgage') document.querySelector('#mortgage details').open = true;
  if (Number.isFinite(saved.scroll) && saved.scroll >= 0 && saved.scroll < 1000000) {
    requestAnimationFrame(() => window.scrollTo(0, saved.scroll));
  }
  connection(data.generatedAt || data.savedAt);
} catch (error) {
  connection(null, error.message + ' Run Update Data to rebuild this file from the saved Excel workbook.');
}

document.getElementById('reload-view').addEventListener('click', reloadDashboard);
window.addEventListener('pagehide', saveView);
for (const event of ['pointerdown', 'keydown', 'scroll']) {
  window.addEventListener(event, () => { lastInteraction = Date.now(); }, {passive:true});
}
setInterval(() => {
  // Keep the current view intact if browser policy prevents saving filters.
  if (!document.hidden && Date.now() - lastInteraction > 5000 && saveView()) window.location.reload();
}, 60000);

</script>
</body>
</html>
